[package]
name = "blvm-lightning"
version = "0.1.5"
edition = "2024"
authors = ["Bitcoin Commons Team"]
description = "Lightning Network payment processor module for blvm-node"
license = "MIT"
repository = "https://github.com/BTCDecoded/blvm-lightning"
homepage = "https://btcdecoded.org"
keywords = ["bitcoin", "lightning", "payment", "module"]
categories = ["cryptography::cryptocurrencies"]

[[bin]]
name = "blvm-lightning"
path = "src/main.rs"

[dependencies]
# blvm-node for module system integration (sled: ModuleDb)
blvm-node = { version = ">=0.1, <1", features = ["sled"] }
# Protocol layer for transaction/block types
blvm-protocol = ">=0.1, <1"

# Async runtime
tokio = { version = "1.48", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP client for Lightning node API
reqwest = { version = "0.12", features = ["json"] }

# Lightning invoice parsing (BOLT11); pins `bitcoin` 0.32 (requires `secp-recovery` for invoice signing).
lightning-invoice = { version = "0.32", features = ["std"] }
# Same bitcoin 0.32 / lightning-invoice 0.32 pair. Upstream LDK, not a vendored fork.
lightning = "=0.0.125"
lightning-net-tokio = "=0.0.125"

# Must match `lightning-invoice` (invoice builder / `Message` hashing use this stack).
bitcoin = { version = "0.32", features = ["std", "secp-recovery"] }
rand = "0.8"

# Hex encoding/decoding
hex = "0.4"

# Futures for async streams
futures = "0.3"

# Async trait support
async-trait = "0.1"

# blvm-sdk for ModuleBootstrap (env-based bootstrap)
blvm-sdk = { version = ">=0.1, <1", default-features = false, features = ["node"] }
blvm-sdk-macros = { version = ">=0.1, <1" }

[dev-dependencies]
tempfile = "3.10"

# Local monorepo: sibling paths override the version pins above.
# Strip this section in CI/release (BTCDecoded/rust-ci/strip-patch-crates-io@main).
[patch.crates-io]
quinn-proto = { git = "https://github.com/quinn-rs/quinn", tag = "quinn-proto-0.11.15" }
blvm-node = { path = "../blvm-node" }
blvm-sdk = { path = "../blvm-sdk" }
blvm-sdk-macros = { path = "../blvm-sdk/crates/blvm-sdk-macros" }
blvm-protocol = { path = "../blvm-protocol" }
blvm-consensus = { path = "../blvm-consensus" }
blvm-primitives = { path = "../blvm-primitives" }
blvm-secp256k1 = { path = "../blvm-secp256k1" }
blvm-spec-lock = { path = "../blvm-spec-lock" }
blvm-muhash = { path = "../blvm-muhash" }
